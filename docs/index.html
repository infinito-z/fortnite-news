<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FN Radar</title>
<style>
  :root{--bg:#0d0b1e;--card:#171433;--line:#2b2660;--txt:#eceaff;--mut:#9a95cf;--acc:#8b5cf6;--hot:#ff4d8d}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#2a1b6b55,transparent),var(--bg);color:var(--txt);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif}
  header{max-width:720px;margin:0 auto;padding:28px 16px 8px}
  h1{margin:0;font-size:28px;letter-spacing:.5px}
  h1 span{color:var(--hot)}
  .sub{color:var(--mut);font-size:14px;margin-top:4px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
  .tab{border:1px solid var(--line);background:transparent;color:var(--mut);padding:6px 12px;border-radius:999px;cursor:pointer;font-size:14px}
  .tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
  main{max-width:720px;margin:0 auto;padding:12px 16px 60px;display:grid;gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .card img{display:block;width:100%;max-height:260px;object-fit:cover;background:#0004}
  .body{padding:14px 16px}
  .meta{display:flex;justify-content:space-between;color:var(--mut);font-size:12px;margin-bottom:6px}
  .tag{color:var(--hot);font-weight:700;text-transform:uppercase;letter-spacing:.6px}
  .txt{white-space:pre-line}
  .empty{color:var(--mut);text-align:center;padding:40px 0}
  footer{color:var(--mut);font-size:12px;text-align:center;padding-bottom:30px}
</style>
</head>
<body>
<header>
  <h1>FN <span>Radar</span> ⚡</h1>
  <div class="sub" id="upd">Noticias de Fortnite al instante</div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="feed"></main>
<footer>Sitio no oficial. Fortnite es marca de Epic Games.</footer>

<script src="news.js"></script>
<script>
const TAGS = ["Todo","Noticia","Cosmético","Tienda","Parche"];
let filter = "Todo";
const $ = s => document.querySelector(s);

function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "ahora";
  if (s < 3600) return Math.floor(s/60) + " min";
  if (s < 86400) return Math.floor(s/3600) + " h";
  return Math.floor(s/86400) + " d";
}
function esc(t){ const d = document.createElement("div"); d.textContent = t ?? ""; return d.innerHTML; }

function render(){
  const list = (window.NEWS || []).filter(n => filter === "Todo" || n.tag === filter);
  $("#feed").innerHTML = list.length ? list.map(n => `
    <article class="card">
      ${n.image ? `<img loading="lazy" src="${esc(n.image)}" alt="">` : ""}
      <div class="body">
        <div class="meta"><span class="tag">${esc(n.tag)}</span><span>${ago(n.ts)}</span></div>
        <div class="txt">${esc(n.text)}</div>
      </div>
    </article>`).join("") : `<div class="empty">Nada por aquí todavía 👀</div>`;
}
function tabs(){
  $("#tabs").innerHTML = TAGS.map(t => `<button class="tab ${t===filter?"on":""}" data-t="${t}">${t}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { filter = b.dataset.t; tabs(); render(); });
}
async function refresh(){
  try{
    const r = await fetch("news.json?_=" + Date.now(), {cache:"no-store"});
    if (r.ok) window.NEWS = await r.json();
  }catch(e){ /* en file:// se usa news.js */ }
  render();
}
tabs(); render(); refresh(); setInterval(refresh, 60000);
</script>
</body>
</html>
